<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internship Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CHARACTER SELECT (fallback only — used when the link has no ?me=Name) -->
<section class="screen" id="screen-select" hidden>
  <h2 class="scr-title">Choose your character</h2>
  <div class="char-grid" id="char-grid"></div>
</section>

<!-- GAME -->
<section class="screen game" id="screen-game" hidden>
  <div class="hud">
    <span class="hud-char" id="hud-char">—</span>
    <span class="hud-stage" id="hud-stage">Stage 1</span>
    <span class="hud-score">📸 <b id="hud-score">0</b></span>
    <button class="hud-btn" id="hud-gallery" aria-label="Collection">📖</button>
  </div>
  <canvas id="game"></canvas>
  <div class="flyhint" id="flyhint">Swipe ← → to change lane · swipe up to jump</div>
</section>

<!-- WIN / RESULT -->
<section class="screen" id="screen-win" hidden>
  <div class="win-wrap">
    <div class="win-emoji" id="win-emoji">🎉</div>
    <h2 class="scr-title" id="win-title">Round complete!</h2>
    <div class="reveal-media" id="reveal-media"></div>
    <p class="win-sub" id="win-sub"></p>
    <div class="board" id="win-board"></div>
    <button class="btn big" id="win-again">PLAY AGAIN</button>
    <button class="btn ghost" id="win-gallery">📖 View collection</button>
  </div>
</section>

<!-- GALLERY + LEADERBOARD -->
<section class="screen" id="screen-gallery" hidden>
  <h2 class="scr-title">Leaderboard 🏆</h2>
  <div class="board" id="gal-board"></div>
  <h3 class="gal-sub"><span id="gal-char"></span>'s collection</h3>
  <div class="gal-grid" id="gal-grid"></div>
  <button class="btn big" id="gal-back">▶ PLAY</button>
</section>

<canvas id="confetti" hidden></canvas>

<script src="three.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
